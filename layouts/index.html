{{ define "main" }}
  <section style="background:#0b1f3a;">
    <div style="max-width:1200px; margin:0 auto; padding:24px 16px; display:flex; align-items:center; justify-content:space-between; gap:24px; flex-wrap:wrap;">
      
      <div style="flex:0 0 320px; color:white;">
        <h1 style="margin:0 0 12px 0; font-size:2rem; line-height:1.2;">
          {{ .Site.Title }}
        </h1>

        {{ with .Site.Params.description }}
        <p style="margin:0; color:rgba(255,255,255,0.85); line-height:1.6;">
          {{ . }}
        </p>
        {{ end }}
      </div>

      <div style="flex:1 1 700px; min-width:300px;">
        <img
          src='{{ "images/top2.png" | relURL }}'
          alt="Ubi-Sense Laboratory hero image"
          style="width:100%; display:block; border-radius:8px;"
        >
      </div>

    </div>
  </section>

  <div class="center cf pv3 pv4-l ph3 ph4-ns mw8">
    {{ .Content }}
  </div>
{{ end }}
